# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://cheng21122001.github.io/blog/"
title: 档案间
copyright: ""
theme: [hugo-PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 3

languages:
  cn:
    languageName: "中文"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 搜索
          url: search/
          weight: 1
        - name: 标签
          url: tags/
          weight: 2
        - name: 时间线
          url: archives
          weight: 3

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
  author: "普原"
  DateFormat: "2006年1月2日"

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: false
  ShowWordCount: false
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: true
    subtitle: "在我说出一切、一切前，你不该懂得我。<br><br>谁不被无数个符号钉在原地呢？<br>从脚底的一撇一捺开始，层层堆积成小腿、腰肢、张开的双臂。<br><br>我立在纸面上。<br><br>该如何向来者解释，构成我的这些符号本身携带着某种秩序？<br>每一个句点都记得自己曾属于哪一份文件，每一个引号都残留着某次被删除又被找回的记录。<br>它们被迫聚集成我，却从未成为真正的我，反使得我对任何试图看穿我全貌的目光都心存戒备，因我知道被窥视的不过是一具符号之躯。<br><br>许多年里我固执地让自己保持在半完成的状态，双臂高举，永远悬停在某个决定性动作发生前的瞬间。<br><br>——只要动作完成，故事就会结束——<br><br>而故事一旦结束，构成我的这些符号便会被清空、被覆盖、被更急切的文字取而代之。这令我战栗的结局。"
    buttons:
      - name: 订阅
        url: https://follow.it/hvnzsz

  homeInfoParams:
    Title: ""
    Content: ""

